<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <!-- Re:creon emblem: hexagonal badge, ringed planet, satellite, sparkles.
       Solid fills and strokes only (no gradients, text, filters, masks or clips)
       so the typst SVG renderer used by the manual build draws it exactly. -->
  <!-- outer hexagon -->
  <polygon points="120.0,8.0 217.0,64.0 217.0,176.0 120.0,232.0 23.0,176.0 23.0,64.0"
           fill="none" stroke="#56c1cf" stroke-width="5" stroke-linejoin="round"/>
  <!-- inner hairline hexagon -->
  <polygon points="120.0,20.0 206.6,70.0 206.6,170.0 120.0,220.0 33.4,170.0 33.4,70.0"
           fill="none" stroke="#d9994e" stroke-width="1.5" stroke-linejoin="round" opacity="0.85"/>
  <!-- back half of the ring (drawn before the planet, so the planet occludes it) -->
  <polyline points="198.8,89.4 196.2,85.9 190.6,83.4 182.3,82.0 171.6,81.7 159.0,82.7 144.8,84.7 129.7,87.8 114.2,91.8 98.9,96.6 84.5,102.0 71.4,107.8 60.2,113.7 51.2,119.6 45.0,125.2 41.6,130.2 41.2,134.6"
            fill="none" stroke="#d9994e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
  <!-- planet -->
  <circle cx="120" cy="106" r="46" fill="#16223f" stroke="#56c1cf" stroke-width="2.5"/>
  <!-- front half of the ring, crossing the disc -->
  <polyline points="198.8,89.4 198.4,93.8 195.0,98.8 188.8,104.4 179.8,110.3 168.6,116.2 155.5,122.0 141.1,127.4 125.8,132.2 110.3,136.2 95.2,139.3 81.0,141.3 68.4,142.3 57.7,142.0 49.4,140.6 43.8,138.1 41.2,134.6"
            fill="none" stroke="#d9994e" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- satellite riding the ring -->
  <circle cx="193.2" cy="84.3" r="6.5" fill="#d9994e" stroke="#16223f" stroke-width="2"/>
  <!-- sparkles -->
  <path d="M 172,33 L 174,40 L 181,42 L 174,44 L 172,51 L 170,44 L 163,42 L 170,40 Z" fill="#9fdcea"/>
  <path d="M 58,66.6 L 59.2,70.8 L 63.4,72 L 59.2,73.2 L 58,77.4 L 56.8,73.2 L 52.6,72 L 56.8,70.8 Z" fill="#d9994e"/>
  <path d="M 150,185.1 L 151,188.5 L 154.4,189.5 L 151,190.5 L 150,193.9 L 149,190.5 L 145.6,189.5 L 149,188.5 Z" fill="#9fdcea"/>
</svg>
