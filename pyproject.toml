[project]
name = "recreon"
version = "0.1.0"
description = "A Python recreation of Anacreon: Reconstruction 4021"
readme = "README.md"
authors = [
    { name = "Ben Overmyer", email = "ben@overmyer.net" }
]
requires-python = ">=3.12"
dependencies = [
    "rich>=15.0.0",
    "textual>=8.2.8",
]

[project.scripts]
recreon = "recreon.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 90
target-version = "py312"

[tool.ruff.lint]
# `F` is Pyflakes: unused imports, undefined names, redefinitions. That last
# one is why this is configured at all -- it found `get_empire_status` defined
# twice in `intrface.py`, where the second silently shadowed the first.
#
# Deliberately narrow. This is a port, and most style rules would argue with
# decisions the Pascal makes for us: `E741` would reject the original's
# single-letter loop variables, `N` would reject the Pascal field names that
# porting convention 3 requires, and `PLR2004` would want every transcribed
# balance constant named. The point here is to catch real defects, not to
# relitigate the porting conventions.
select = ["F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["recreon"]

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
