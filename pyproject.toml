[project]
name = "recreon"
version = "0.1.0"
description = "A Python recreation of Anacreon: Reconstruction 4021"
readme = "README.md"
authors = [
    { name = "Ben Overmyer", email = "ben@overmyer.net" }
]
requires-python = ">=3.12"
dependencies = [
    "rich>=15.0.0",
    "textual>=8.2.8",
]

[project.scripts]
recreon = "recreon.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
